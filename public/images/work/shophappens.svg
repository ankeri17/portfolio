<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img">
  <!-- One line finding its way between scattered circles to a plum point.
       Palette from BRAND.md section 4 only; no gradients. -->
  <rect width="1280" height="800" fill="#EDEBEF"/>

  <!-- what's in the way -->
  <g fill="none">
    <circle cx="250" cy="180" r="18" stroke="#E2E0E5" stroke-width="3"/>
    <circle cx="420" cy="150" r="12" stroke="#6E6A75" stroke-width="2"/>
    <circle cx="180" cy="640" r="22" stroke="#E2E0E5" stroke-width="3"/>
    <circle cx="520" cy="660" r="15" stroke="#6E6A75" stroke-width="2"/>
    <circle cx="700" cy="220" r="25" stroke="#E2E0E5" stroke-width="3"/>
    <circle cx="880" cy="600" r="18" stroke="#E2E0E5" stroke-width="3"/>
    <circle cx="1000" cy="180" r="14" stroke="#6E6A75" stroke-width="2"/>
    <circle cx="620" cy="420" r="10" stroke="#6E6A75" stroke-width="2"/>
    <circle cx="330" cy="480" r="13" stroke="#E2E0E5" stroke-width="3"/>
  </g>

  <!-- the way through -->
  <path d="M-20 560 C 140 480, 200 300, 340 300 C 480 300, 470 540, 610 560 C 700 573, 760 420, 850 380 C 930 345, 990 430, 1040 430 C 1110 430, 1140 350, 1160 320"
    fill="none" stroke="#16151A" stroke-width="3" stroke-linecap="round"/>

  <circle cx="1165" cy="315" r="9" fill="#6B2049"/>
</svg>
