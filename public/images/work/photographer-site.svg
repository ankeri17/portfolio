<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img">
  <!-- Star trails turning around one fixed point, over the long swell of
       a prairie. Palette from BRAND.md section 4 only; no gradients. -->
  <rect width="1280" height="800" fill="#EDEBEF"/>

  <!-- trails, arcs of circles around the pole star -->
  <g fill="none" stroke-linecap="round">
    <path d="M917.6 293.4 A110 110 0 1 1 917.6 86.6" stroke="#6E6A75" stroke-width="2.5"/>
    <path d="M880 375 A185 185 0 0 1 880 5" stroke="#16151A" stroke-width="2.5"/>
    <path d="M784.2 453.2 A280 280 0 0 1 700 -24.5" stroke="#E2E0E5" stroke-width="3"/>
    <path d="M690 519.1 A380 380 0 0 1 522.9 60" stroke="#6E6A75" stroke-width="2"/>
    <path d="M565 565.4 A490 490 0 0 1 391.9 232.7" stroke="#E2E0E5" stroke-width="3"/>
  </g>

  <!-- the pole star and a few loose ones -->
  <circle cx="880" cy="190" r="7" fill="#6B2049"/>
  <circle cx="330" cy="120" r="3.5" fill="#6E6A75"/>
  <circle cx="200" cy="330" r="3" fill="#6E6A75"/>
  <circle cx="1150" cy="420" r="3.5" fill="#6E6A75"/>
  <circle cx="460" cy="430" r="3" fill="#6E6A75"/>

  <!-- the prairie, two slow swells -->
  <path d="M-20 660 C 320 610, 700 700, 1300 640" fill="none" stroke="#16151A" stroke-width="3" stroke-linecap="round"/>
  <path d="M-20 730 C 400 690, 800 762, 1300 710" fill="none" stroke="#E2E0E5" stroke-width="3" stroke-linecap="round"/>
</svg>
