<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img">
  <!-- Thick star trails turning around one fixed point, the outermost
       clipped by the frame the way a long exposure is, over the soft
       silhouette of a prairie. Palette from BRAND.md section 4 only; no
       gradients. -->
  <rect width="1280" height="800" fill="#EDEBEF"/>

  <!-- trails, arcs of circles around the pole star -->
  <g fill="none" stroke-linecap="round">
    <path d="M975 350 A105 105 0 0 0 765 350" stroke="#16151A" stroke-width="10"/>
    <path d="M1022 437 A175 175 0 1 0 718 437" stroke="#6E6A75" stroke-width="10"/>
    <path d="M1091 477 A255 255 0 1 0 649 477" stroke="#E2E0E5" stroke-width="12"/>
    <path d="M1215 350 A345 345 0 0 0 525 350" stroke="#6E6A75" stroke-width="9"/>
    <path d="M430 350 A440 440 0 0 1 1310 350" stroke="#E2E0E5" stroke-width="12"/>
  </g>

  <!-- the pole star on its halo, and a few loose ones -->
  <circle cx="870" cy="350" r="40" fill="#F5EDF1"/>
  <circle cx="870" cy="350" r="12" fill="#6B2049"/>
  <circle cx="240" cy="180" r="6" fill="#6E6A75"/>
  <circle cx="160" cy="380" r="5" fill="#6E6A75"/>
  <circle cx="1140" cy="70" r="6" fill="#6E6A75"/>
  <circle cx="1150" cy="590" r="5" fill="#6E6A75"/>
  <circle cx="330" cy="470" r="5" fill="#6E6A75"/>

  <!-- the prairie, one slow swell -->
  <path d="M-40 645 C 280 605, 640 668, 920 636 C 1080 618, 1220 645, 1320 632 L 1320 820 L -40 820 Z" fill="#E2E0E5"/>
  <path d="M-40 645 C 280 605, 640 668, 920 636 C 1080 618, 1220 645, 1320 632" fill="none" stroke="#16151A" stroke-width="10" stroke-linecap="round"/>
</svg>
