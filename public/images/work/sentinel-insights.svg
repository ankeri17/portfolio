<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img">
  <!-- A monitored signal over ruled paper, one pulse marked in plum.
       Palette from BRAND.md section 4 only; no gradients or shadows. -->
  <rect width="1280" height="800" fill="#EDEBEF"/>

  <!-- ruled lines -->
  <g stroke="#E2E0E5" stroke-width="2">
    <line x1="100" y1="160" x2="1180" y2="160"/>
    <line x1="100" y1="250" x2="1180" y2="250"/>
    <line x1="100" y1="340" x2="1180" y2="340"/>
    <line x1="100" y1="430" x2="1180" y2="430"/>
    <line x1="100" y1="520" x2="1180" y2="520"/>
    <line x1="100" y1="610" x2="1180" y2="610"/>
  </g>

  <!-- the signal -->
  <path
    d="M100 430 H430 L470 415 L505 320 L550 505 L590 430 H770 L800 398 L830 452 L860 430 H1108"
    fill="none" stroke="#16151A" stroke-width="3.5"
    stroke-linejoin="round" stroke-linecap="round"/>

  <!-- the pulse worth catching, and the live end of the line -->
  <circle cx="505" cy="320" r="9" fill="#6B2049"/>
  <circle cx="1108" cy="430" r="7" fill="#FDFDFD" stroke="#16151A" stroke-width="3"/>
</svg>
