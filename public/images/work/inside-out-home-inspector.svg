<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img">
  <!-- Floor plan with door swings and one room marked for inspection.
       Palette from BRAND.md section 4 only; no gradients or shadows. -->
  <rect width="1280" height="800" fill="#EDEBEF"/>

  <!-- outer walls -->
  <rect x="340" y="180" width="600" height="440" fill="#FDFDFD" stroke="#16151A" stroke-width="3.5"/>

  <!-- the room that gets looked at -->
  <rect x="782" y="432" width="156" height="186" fill="#F5EDF1"/>
  <circle cx="860" cy="525" r="9" fill="#6B2049"/>

  <!-- interior walls, with openings for the doors -->
  <g stroke="#16151A" stroke-width="2.5" stroke-linecap="square">
    <line x1="620" y1="180" x2="620" y2="330"/>
    <line x1="620" y1="390" x2="620" y2="430"/>
    <line x1="340" y1="430" x2="480" y2="430"/>
    <line x1="540" y1="430" x2="940" y2="430"/>
    <line x1="780" y1="430" x2="780" y2="500"/>
    <line x1="780" y1="560" x2="780" y2="620"/>
  </g>

  <!-- door leaves and swings -->
  <g fill="none" stroke-linecap="round">
    <line x1="620" y1="330" x2="680" y2="330" stroke="#16151A" stroke-width="2"/>
    <path d="M680 330 A60 60 0 0 1 620 390" stroke="#6E6A75" stroke-width="1.5"/>
    <line x1="480" y1="430" x2="480" y2="490" stroke="#16151A" stroke-width="2"/>
    <path d="M480 490 A60 60 0 0 1 540 430" stroke="#6E6A75" stroke-width="1.5"/>
    <line x1="780" y1="500" x2="724" y2="522" stroke="#16151A" stroke-width="2"/>
    <path d="M724 522 A60 60 0 0 1 780 560" stroke="#6E6A75" stroke-width="1.5"/>
  </g>
</svg>
