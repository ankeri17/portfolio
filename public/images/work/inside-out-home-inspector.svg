<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img">
  <!-- One thick spiral unwinding from the inside out, from a plum point on
       a soft wash, trailing off at the top. Palette from BRAND.md
       section 4 only; no gradients. -->
  <rect width="1280" height="800" fill="#F2ECE1"/>

  <!-- the wash the spiral grows out of -->
  <circle cx="640" cy="418" r="150" fill="#F7ECD2"/>

  <!-- the spiral -->
  <path d="M670 420 A30 30 0 0 0 610 420 A40 40 0 0 0 690 420 A54 54 0 0 0 582 420 A73 73 0 0 0 728 420 A99 99 0 0 0 530 420 A133 133 0 0 0 796 420 A180 180 0 0 0 436 420 A243 243 0 0 0 922 420 A328 328 0 0 0 594 92"
    fill="none" stroke="#1D1D1D" stroke-width="13" stroke-linecap="round"/>

  <!-- where it goes next -->
  <circle cx="544" cy="70" r="7" fill="#A48C72"/>
  <circle cx="490" cy="54" r="5" fill="#A48C72"/>

  <circle cx="643" cy="418" r="12" fill="#C8102E"/>
</svg>
