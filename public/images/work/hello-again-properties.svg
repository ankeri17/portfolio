    <path d="M398 400 C398 336, 462 288, 528 288 C594 288, 642 350, 642 415 C642 480, 582 532, 515 532 C450 532, 398 465, 398 400 Z" stroke="#6E6A75" stroke-width="2.5"/>
    <path d="M322 420 C322 306, 408 212, 515 212 C625 212, 718 296, 718 405 C718 512, 632 608, 525 608 C418 608, 322 530, 322 420 Z" stroke="#6E6A75" stroke-width="2"/>
