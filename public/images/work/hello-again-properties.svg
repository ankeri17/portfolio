<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img">
  <!-- Bold rings rippling out from a returning point on still water, each
       drifting slightly off the last, with a second smaller ripple beside
       them. Palette from BRAND.md section 4 only; no gradients. -->
  <rect width="1280" height="800" fill="#EDEBEF"/>

  <!-- the main ripple: nested circles, centers drifting like real water -->
  <g fill="none" stroke-linecap="round">
    <circle cx="535" cy="405" r="372" stroke="#E2E0E5" stroke-width="11"/>
    <circle cx="550" cy="395" r="282" stroke="#E2E0E5" stroke-width="12"/>
    <circle cx="532" cy="408" r="196" stroke="#6E6A75" stroke-width="10"/>
    <circle cx="548" cy="392" r="118" stroke="#16151A" stroke-width="11"/>
  </g>
  <circle cx="540" cy="400" r="52" fill="#F5EDF1" stroke="#16151A" stroke-width="11"/>
  <circle cx="540" cy="400" r="11" fill="#6B2049"/>

  <!-- the second visit -->
  <g fill="none">
    <circle cx="1014" cy="596" r="120" stroke="#E2E0E5" stroke-width="9"/>
    <circle cx="1027" cy="583" r="76" stroke="#E2E0E5" stroke-width="10"/>
    <circle cx="1020" cy="590" r="34" fill="#FDFDFD" stroke="#6E6A75" stroke-width="9"/>
  </g>
  <circle cx="1020" cy="590" r="7" fill="#16151A"/>
</svg>
