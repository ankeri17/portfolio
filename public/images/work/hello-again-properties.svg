<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img">
  <!-- Bold rings rippling out from a returning point on still water, each
       drifting slightly off the last, with a second smaller ripple beside
       them. Palette from BRAND.md section 4 only (crimson, charcoal, gold, taupe); no gradients. -->
  <rect width="1280" height="800" fill="#F2ECE1"/>

  <!-- the main ripple: nested circles, centers drifting like real water -->
  <g fill="none" stroke-linecap="round">
    <circle cx="535" cy="405" r="372" stroke="#D8C9B7" stroke-width="11"/>
    <circle cx="550" cy="395" r="282" stroke="#D8C9B7" stroke-width="12"/>
    <circle cx="532" cy="408" r="196" stroke="#A48C72" stroke-width="10"/>
    <circle cx="548" cy="392" r="118" stroke="#1D1D1D" stroke-width="11"/>
  </g>
  <circle cx="540" cy="400" r="52" fill="#F7ECD2" stroke="#1D1D1D" stroke-width="11"/>
  <circle cx="540" cy="400" r="11" fill="#C8102E"/>

  <!-- the second visit -->
  <g fill="none">
    <circle cx="1014" cy="596" r="120" stroke="#D8C9B7" stroke-width="9"/>
    <circle cx="1027" cy="583" r="76" stroke="#D8C9B7" stroke-width="10"/>
    <circle cx="1020" cy="590" r="34" fill="#FAF6EE" stroke="#A48C72" stroke-width="9"/>
  </g>
  <circle cx="1020" cy="590" r="7" fill="#1D1D1D"/>
</svg>
